# Runs the tests on every pull request and on pushes to master.
# Read-only token, no secrets, no deploy. Installs skip package scripts.
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: yarn install --frozen-lockfile --ignore-scripts
      - run: yarn test
      - run: yarn lint
      # Builds into the runner's dist/ and stops there. Deploying stays a manual step.
      - run: yarn build
